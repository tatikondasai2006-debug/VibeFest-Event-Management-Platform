{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block content %}
<section class="section">
  <div class="container-narrow" style="text-align:center">
    <h1>{{ code or 500 }} — {{ title or 'Something went wrong' }}</h1>
    <p class="text-muted">{{ message or 'An unexpected error occurred. Please try again.' }}</p>
    <a class="btn btn-primary" href="{{ url_for('public.index') }}">Back to home</a>
  </div>
</section>
{% endblock %}
